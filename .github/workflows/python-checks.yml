name: Python checks
on:
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  test:
    name: Python 3.14 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.6'
      - run: uv sync --frozen --no-python-downloads
      - run: uv run --frozen pytest -m "not docker" -q --tb=short
      - run: uv run --frozen ruff check src tests
