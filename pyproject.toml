[project]
name = "devtools-mcp-server"
version = "0.1.0"
description = "Local read-only Git inspection over MCP"
requires-python = ">=3.14,<3.15"
dependencies = ["mcp>=2,<3", "psutil>=7,<8", "pydantic>=2.12,<3", "anyio>=4.10,<5"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "jsonschema>=4,<5"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devtools_mcp_server"]

[tool.uv]
python-downloads = "never"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100
